<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北市立中正國中｜時光與卓越的敘事曲</title>
    
    <!-- PWA 核心標籤 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #0a0a0a;
            --accent-gold: #c5a059;
            --text-light: #e0e0e0;
            --frame-white: #ffffff;
            --letterbox-height: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* --- 膠卷質感與電影黑邊 --- */
        .film-grain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_filmgrain.png');
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
            animation: grain 0.5s steps(10) infinite;
        }

        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-1%, -1%); }
            30% { transform: translate(1%, 1%); }
            50% { transform: translate(-0.5%, 1.5%); }
            70% { transform: translate(1.5%, -0.5%); }
            90% { transform: translate(-1%, 0.5%); }
        }

        .letterbox {
            position: fixed;
            left: 0; width: 100%;
            height: var(--letterbox-height);
            background: #000;
            z-index: 1000;
        }
        .letterbox.top { top: 0; }
        .letterbox.bottom { bottom: 0; }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 120%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), 
                        url('https://raw.githubusercontent.com/sean0316102-design/school/main/photo%201.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            will-change: transform;
        }

        .hero-content h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            color: var(--accent-gold);
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hero-content p {
            font-size: 1.2rem;
            letter-spacing: 0.3rem;
            opacity: 0.8;
            margin-bottom: 2.5rem;
        }

        .cta-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.5s ease forwards 0.8s;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-cinematic {
            padding: 12px 30px;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .btn-cinematic:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* 專門給安裝按鈕的樣式 */
        #installBtn {
            display: none; /* 初始隱藏 */
            margin-top: 20px;
            border-style: dashed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .narrative-section {
            display: flex;
            align-items: center;
            margin-bottom: 150px;
            gap: 60px;
        }

        .narrative-section.reverse {
            flex-direction: row-reverse;
        }

        .content-box {
            flex: 1;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        .content-box h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
        }

        .content-box p {
            font-size: 1.1rem;
            color: #bbb;
            text-align: justify;
        }

        .image-box {
            flex: 1;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.215, 0.61, 0.355, 1);
            transition-delay: 0.2s;
        }

        .polaroid {
            background: var(--frame-white);
            padding: 15px 15px 60px 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: rotate(-3deg);
            max-width: 90%;
            transition: transform 0.5s ease;
        }

        .narrative-section.reverse .polaroid {
            transform: rotate(3deg);
        }

        .polaroid img {
            width: 100%;
            height: auto;
            filter: sepia(20%) contrast(1.1);
            display: block;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        footer {
            padding: 80px 0;
            text-align: center;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            background: #050505;
        }

        .footer-links { margin-bottom: 20px; }
        .footer-links a {
            color: var(--text-light);
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        footer p {
            font-size: 0.9rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .narrative-section, .narrative-section.reverse { flex-direction: column; }
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="film-grain"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>

    <section class="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-content">
            <h1>中正國中</h1>
            <p>淬鍊時光的教育殿堂</p>
            <div class="cta-group">
                <a href="https://www.ccjhs.tp.edu.tw/" target="_blank" class="btn-cinematic">訪問官網</a>
                <a id="installBtn" class="btn-cinematic">安裝應用程式</a>
            </div>
        </div>
    </section>

    <div class="container">
        <!-- 內容保持原樣 -->
        <section class="narrative-section">
            <div class="image-box reveal">
                <div class="polaroid">
                    <img src="https://raw.githubusercontent.com/sean0316102-design/school/main/photo%202.jpg">
                </div>
            </div>
            <div class="content-box reveal">
                <h2>紅磚牆下的思想起</h2>
                <p>每一塊紅磚都刻劃著學子們奮鬥的痕跡。</p>
            </div>
        </section>
        <!-- 其他 section 省略... -->
    </div>

    <footer>
        <p>翊華程式設計 | 網頁與作品集製作</p>
    </footer>

    <script>
        // --- 1. Service Worker 註冊 ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('SW 註冊成功'))
                    .catch(err => console.log('SW 註冊失敗'));
            });
        }

        // --- 2. 電腦端安裝提示觸發器 ---
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // 防止 Chrome 67 以前版本自動顯示提示
            e.preventDefault();
            // 存下事件以便稍後觸發
            deferredPrompt = e;
            // 顯示安裝按鈕
            installBtn.style.display = 'inline-block';

            installBtn.addEventListener('click', (e) => {
                // 隱藏按鈕
                installBtn.style.display = 'none';
                // 顯示安裝對話框
                deferredPrompt.prompt();
                // 等待使用者回應
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('使用者接受安裝');
                    }
                    deferredPrompt = null;
                });
            });
        });

        // --- 3. 滾動與揭示動畫 (保持原樣) ---
        window.addEventListener('scroll', function() {
            const scrolled = window.pageYOffset;
            const heroBg = document.getElementById('heroBg');
            if (heroBg) heroBg.style.transform = 'translateY(' + (scrolled * 0.4) + 'px)';
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
